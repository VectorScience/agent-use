[package]
name = "cursor-remote"
version = "1.0.0"
description = "Control Cursor from your phone"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cursor_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
